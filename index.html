<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:title" content="Whoop">
    <meta property="og:description" content="Whoop on the web">
    <meta property="og:image" content="images/icon.png">
    <meta property="og:url" content="https://soda2611.github.io/Whoop">
    <title>Whoop</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="images/Icon.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Birthstone&family=Coiny&family=Pacifico&family=Patrick+Hand+SC&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
</head>
<body>
    <div id="content" style="display: flex; justify-content: center;">
        <div id="logo-container">
            <img src="images/Logo.png" alt="" style="position: fixed; left: calc(50% -  80px); width: 150px; height: 60px; top: 72px">
            <div style="width: 100%; height: 55px; position: fixed; top: 0px; background-color: #e6e6e6; display: flex; justify-content: center; align-items: center;">
                <p style="position: absolute; font-family: 'Segoe UI'; font-size: clamp(11px, 2vw, 15px); height: (16px, 2vw, 20px); left: 10px"><b>Download the Whoop app</b></p>
                <a href="https://github.com/soda2611/WSR/blob/main/Whoop%20Installer%20for%20Windows.exe" style="text-decoration: none; position: fixed; right: 145px; width: 120px; height: 40px;"><button class="download-button"><img src="https://www.wintotal.de/media/2021/07/Logo-Windows-11-klein-128x128.png" style="height: 20px;">Windows</button></a>
                <a href="https://github.com/soda2611/WSR-for-Android/releases/latest" style="text-decoration: none; position: fixed; right: 15px; width: 120px; height: 40px;"><button class="download-button"><img src="https://cdn.freelogovectors.net/wp-content/uploads/2023/09/androidlogo-2023-freelogovectors.net_.png" style="height: 20px;">Android</button></a>
            </div>
        </div>
        <div id="display-zone" style="position: absolute; width: 80%; height: calc(100% - 250px); top: 140px; display: flex; justify-content: center; overflow: auto;">
            <h1 id="title"></h1>
            <p class="selectable" id="result"><b></b></p>
        </div>
        <div id="search-bar-container">
            <div id="toolbar-space">
                <i class="material-icons" style="position: absolute; font-size: 25px; left: 10px; cursor: default;">favorite</i>
                <i class="material-icons" style="position: absolute; font-size: 25px; right: 10px; cursor: default;">history</i>
            </div>
            <div id="search-bar">
                <i class="material-icons" style="position: absolute; font-size: 25px; left: 18px; cursor: default;">search</i>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
